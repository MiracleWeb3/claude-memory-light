<svg width="900" height="450" viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" role="img" aria-label="Every store cml writes, the hook that writes it, and the hook that reads it back.">
  <title>claude-memory-light — three stores, each hooked on both sides</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8b949e"/>
    </marker>
    <marker id="ao" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="900" height="450" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- band headers -->
  <g font-size="10" letter-spacing="1.4">
    <text x="28" y="36" fill="#8b949e">WRITTEN BY A HOOK</text>
    <text x="326" y="36" fill="#8b949e">WHERE IT LANDS</text>
    <text x="636" y="36" fill="#f97316">READ BACK BY A HOOK</text>
  </g>
  <line x1="28" y1="45" x2="872" y2="45" stroke="#21262d"/>

  <!-- ─────────────────────────  row 1 · index.db  ───────────────────────── -->
  <text x="28" y="76" fill="#8b949e" font-size="10">Stop</text>
  <text x="28" y="95" fill="#e6edf3" font-size="12.5">cml index</text>
  <g fill="#8b949e" font-size="10">
    <text x="28" y="118">reads what is already on disk:</text>
    <text x="28" y="135" fill="#8b949e">~/.claude/projects/**.jsonl</text>
    <text x="28" y="151">every session, every subagent,</text>
    <text x="28" y="166">tool calls and their output</text>
    <text x="28" y="188" fill="#8b949e">memory/*.md · wiki/*.md</text>
  </g>

  <line x1="290" y1="130" x2="322" y2="130" stroke="#8b949e" marker-end="url(#a)"/>

  <rect x="326" y="56" width="270" height="152" rx="8" fill="#161b22" stroke="#f97316" stroke-width="1.2"/>
  <text x="342" y="78" fill="#f0883e" font-size="13" font-weight="700">index.db</text>
  <text x="342" y="93" fill="#8b949e" font-size="10">one SQLite file · FTS5 · no extension</text>
  <text x="342" y="109" fill="#8b949e" font-size="9">table</text>
  <text x="398" y="109" fill="#8b949e" font-size="9">--role</text>
  <line x1="342" y1="116" x2="580" y2="116" stroke="#30363d"/>
  <g font-size="10.5">
    <text x="342" y="134" fill="#79c0ff">mem</text>
    <text x="398" y="134" fill="#8b949e">talk</text>
    <text x="444" y="134" fill="#c9d1d9">prompts + replies</text>

    <text x="342" y="153" fill="#7ee787">work</text>
    <text x="398" y="153" fill="#8b949e">ran</text>
    <text x="444" y="153" fill="#c9d1d9">tool calls + output</text>

    <text x="342" y="172" fill="#d2a8ff">scene</text>
    <text x="398" y="172" fill="#8b949e">scene</text>
    <text x="444" y="172" fill="#c9d1d9">session summaries</text>

    <text x="342" y="194" fill="#8b949e">emb</text>
    <text x="398" y="194" fill="#8b949e">—</text>
    <text x="444" y="194" fill="#8b949e">vectors, f32 blob</text>
  </g>

  <line x1="600" y1="130" x2="632" y2="130" stroke="#f97316" marker-end="url(#ao)"/>

  <g>
    <text x="636" y="76" fill="#8b949e" font-size="10">UserPromptSubmit</text>
    <text x="636" y="95" fill="#e6edf3" font-size="12.5">cml recall</text>
    <text x="636" y="111" fill="#8b949e" font-size="10">gated hits, injected before Claude answers</text>
    <text x="636" y="131" fill="#e6edf3" font-size="12.5">cml hint</text>
    <text x="636" y="147" fill="#8b949e" font-size="10">nudges a capture, once per category</text>

    <text x="636" y="172" fill="#8b949e" font-size="10">your terminal</text>
    <text x="636" y="191" fill="#e6edf3" font-size="12.5">cml search · loops · eval · stats</text>
  </g>

  <!-- ─────────────────────────  row 2 · inbox  ───────────────────────── -->
  <line x1="28" y1="228" x2="872" y2="228" stroke="#21262d"/>

  <text x="28" y="252" fill="#8b949e" font-size="10">Stop</text>
  <text x="28" y="271" fill="#e6edf3" font-size="12.5">cml capture</text>
  <text x="28" y="288" fill="#8b949e" font-size="10">this turn's message, flagged when</text>
  <text x="28" y="303" fill="#8b949e" font-size="10">it reads like a correction</text>

  <line x1="290" y1="275" x2="322" y2="275" stroke="#8b949e" marker-end="url(#a)"/>

  <rect x="326" y="246" width="270" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="342" y="270" fill="#c9d1d9" font-size="12.5">inbox/&lt;project&gt;.md</text>
  <text x="342" y="290" fill="#8b949e" font-size="10">plain markdown, one file per project</text>

  <line x1="600" y1="275" x2="632" y2="275" stroke="#f97316" marker-end="url(#ao)"/>

  <text x="636" y="252" fill="#8b949e" font-size="10">SessionStart</text>
  <text x="636" y="271" fill="#e6edf3" font-size="12.5">cml nudge</text>
  <text x="636" y="288" fill="#8b949e" font-size="10">the signals themselves arrive in the</text>
  <text x="636" y="303" fill="#8b949e" font-size="10">briefing — with open loops and wiki topics</text>

  <!-- ─────────────────────────  row 3 · spill  ───────────────────────── -->
  <line x1="28" y1="330" x2="872" y2="330" stroke="#21262d"/>

  <text x="28" y="354" fill="#8b949e" font-size="10">PostToolUse</text>
  <text x="28" y="373" fill="#e6edf3" font-size="12.5">cml offload</text>
  <text x="28" y="390" fill="#8b949e" font-size="10">oversized tool output, condensed</text>
  <text x="28" y="405" fill="#8b949e" font-size="10">before it reaches the context window</text>

  <line x1="290" y1="377" x2="322" y2="377" stroke="#8b949e" marker-end="url(#a)"/>

  <rect x="326" y="348" width="270" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="342" y="372" fill="#c9d1d9" font-size="12.5">spill/&lt;session&gt;/*.txt</text>
  <text x="342" y="392" fill="#8b949e" font-size="10">verbatim; nothing is thrown away</text>

  <line x1="600" y1="377" x2="632" y2="377" stroke="#f97316" marker-end="url(#ao)"/>

  <text x="636" y="354" fill="#8b949e" font-size="10">the marker left behind</text>
  <text x="636" y="373" fill="#e6edf3" font-size="11.5">⟨cml: 79 lines elided · full: …⟩</text>
  <text x="636" y="390" fill="#8b949e" font-size="10">one Read away when it turns out to matter</text>

  <!-- footer -->
  <text x="450" y="435" text-anchor="middle" fill="#8b949e" font-size="10">every box above is a process that starts, writes, and exits — no daemon, no worker, no port</text>
</svg>

<svg width="960" height="424" viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" role="img" aria-label="Terminal session: one cml search returns talk, ran and scene rows together; --role narrows to one lane; stats and doctor report the index.">
  <title>cml search — verbatim output from a 200 MB index</title>

  <rect width="960" height="424" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 12 a12 12 0 0 1 12 -12 h936 a12 12 0 0 1 12 12 v28 h-960 z" fill="#161b22"/>
  <line x1="0" y1="40" x2="960" y2="40" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="480" y="25" fill="#8b949e" font-size="12" text-anchor="middle">cml — the memory was already on disk</text>

  <!-- Columns are positioned absolutely rather than padded with spaces: a monospace
       fallback with different metrics still lands every row on the same grid. -->
  <text x="24" y="78" fill="#7ee787">$</text>
  <text x="40" y="78" fill="#e6edf3">cml search "daita mtu"</text>

  <g font-size="13">
    <text x="24"  y="104" fill="#8b949e">2026-08-07</text>
    <text x="121" y="104" fill="#79c0ff">talk</text>
    <text x="177" y="104" fill="#8b949e">misc</text>
    <text x="306" y="104" fill="#8b949e">patro1a-</text>
    <text x="379" y="104" fill="#484f58">|</text>
    <text x="395" y="104" fill="#c9d1d9">--- name: patro1a-daita-mtu description: "Patro1a wifi + Mullvad</text>

    <text x="24"  y="128" fill="#8b949e">2026-07-31</text>
    <text x="121" y="128" fill="#7ee787">ran</text>
    <text x="177" y="128" fill="#8b949e">misc</text>
    <text x="306" y="128" fill="#8b949e">87e83bab</text>
    <text x="379" y="128" fill="#484f58">|</text>
    <text x="395" y="128" fill="#c9d1d9">MTU parameter has been updated --- verify --- MTU: 1200 Quantum</text>

    <text x="24"  y="152" fill="#8b949e">2026-07-31</text>
    <text x="121" y="152" fill="#d2a8ff">scene</text>
    <text x="177" y="152" fill="#8b949e">misc</text>
    <text x="306" y="152" fill="#8b949e">87e83bab</text>
    <text x="379" y="152" fill="#484f58">|</text>
    <text x="395" y="152" fill="#c9d1d9">DAITA obfuscation blocking RX on Patro1a VPN connection — On P</text>
  </g>
  <text x="121" y="177" font-size="11.5" fill="#8b949e">one query, three lanes, merged by rank — you never have to know which table holds the answer</text>

  <text x="24" y="217" fill="#7ee787">$</text>
  <text x="40" y="217" fill="#e6edf3">cml search "daita mtu" --role ran</text>
  <g font-size="13">
    <text x="24"  y="243" fill="#8b949e">2026-07-31</text>
    <text x="121" y="243" fill="#7ee787">ran</text>
    <text x="177" y="243" fill="#8b949e">misc</text>
    <text x="306" y="243" fill="#8b949e">87e83bab</text>
    <text x="379" y="243" fill="#484f58">|</text>
    <text x="395" y="243" fill="#c9d1d9">MTU parameter has been updated --- verify --- MTU: 1200 Quantum</text>
  </g>

  <text x="24" y="283" fill="#7ee787">$</text>
  <text x="40" y="283" fill="#e6edf3">cml stats</text>
  <text x="24" y="309" fill="#c9d1d9">5240 rows <tspan fill="#8b949e">(assistant=3041, user=1908, memory=288, wiki=3)</tspan> | 588 knowledge | 72 scenes | 190 sessions | 200.4 MB</text>

  <text x="24" y="349" fill="#7ee787">$</text>
  <text x="40" y="349" fill="#e6edf3">cml doctor</text>
  <text x="24"  y="375" fill="#8b949e">lanes</text>
  <text x="161" y="375" fill="#8b949e">: <tspan fill="#c9d1d9">conversation 5240 · tools 123799 · scene 72</tspan> — all reachable from --role</text>
  <text x="24"  y="399" fill="#8b949e">recall</text>
  <text x="161" y="399" fill="#8b949e">: <tspan fill="#c9d1d9">fired in 92 sessions, 1104 memories injected</tspan></text>
</svg>
